<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Drills</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <header class="page-header">
    <div class="logo-ring">🧮</div>
    <h1 class="home-title">Math Drills</h1>
    <p class="home-sub">Pick a drill · blast through it</p>
  </header>

  <div class="drill-grid" id="drillGrid"></div>
</div>

<script type="module">
/* -- REGISTRY ---------------------------------------------------
   To add a new drill:
   1. Create drills/<id>.js  (see multiplication.js for the shape)
   2. Add one object to this array
---------------------------------------------------------------- */

import { DRILLS } from './drills/index.js';

/* -- RENDER -- */
const grid = document.getElementById('drillGrid');

for (const id of DRILLS) {
  const { default: drill } = await import(`./drills/${id}.js`);
  const card = document.createElement('button');
  card.className = 'drill-card';
  card.style.cssText = `--accent:${drill.color}; --accent-rgb:${drill.rgb};`;
  card.innerHTML = `
    <div class="drill-icon-wrap">${drill.icon}</div>
    <div class="drill-info">
      <div class="drill-name">${drill.name}</div>
      <div class="drill-desc">${drill.desc}</div>
    </div>
    <div class="drill-count">${drill.countLabel}</div>
    <div class="drill-arrow">›</div>
  `;
  card.addEventListener('click', () => {
    location.href = `drill.html?drill=${id}`;
  });
  grid.appendChild(card);
}
</script>
</body>
</html>
