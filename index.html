<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Drills</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <header class="page-header">
    <div class="logo-ring">🧮</div>
    <h1 class="home-title">Math Drills</h1>
    <p class="home-sub">Pick a drill · blast through it</p>
  </header>

  <div class="drill-grid" id="drillGrid"></div>
</div>

<script>
/* -- REGISTRY ---------------------------------------------------
   To add a new drill:
   1. Create drills/<id>.js  (see multiplication.js for the shape)
   2. Add one object to this array
---------------------------------------------------------------- */
const DRILLS = [
  {
    id:    'multiplication',
    name:  'Multiplication',
    icon:  '×',
    color: '#00e5c4',
    rgb:   '0,229,196',
    desc:  '2× through 12× tables',
    count: '121 facts',
  },
  { id: 'division', name: 'Division', icon: '÷', color: '#ff2d78', rgb: '255,45,120', desc: '121 division facts', count: '121 facts' },
  // { id: 'squares',   name: 'Squares',   icon: '²', color: '#ffd60a', rgb: '255,214,10',  desc: '1² through 20²',    count: '20 facts'  },
  // { id: 'addition',  name: 'Addition',  icon: '+', color: '#8b5cf6', rgb: '139,92,246',  desc: 'Sums to 20',        count: '60 facts'  },
];

/* -- RENDER -- */
const grid = document.getElementById('drillGrid');

for (const d of DRILLS) {
  const card = document.createElement('button');
  card.className = 'drill-card';
  card.style.cssText = `--accent:${d.color}; --accent-rgb:${d.rgb};`;
  card.innerHTML = `
    <div class="drill-icon-wrap">${d.icon}</div>
    <div class="drill-info">
      <div class="drill-name">${d.name}</div>
      <div class="drill-desc">${d.desc}</div>
    </div>
    <div class="drill-count">${d.count}</div>
    <div class="drill-arrow">›</div>
  `;
  card.addEventListener('click', () => {
    location.href = `drill.html?drill=${d.id}`;
  });
  grid.appendChild(card);
}
</script>
</body>
</html>
