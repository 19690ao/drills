<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drill</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div id="roundOverlay">
  <div class="overlay-round" id="overlayRound">Correction Round!</div>
  <div class="overlay-count" id="overlayCount">5 questions to retry</div>
  <div class="overlay-bar"><div class="overlay-bar-fill"></div></div>
</div>

<div class="container">

  <!-- === START === -->
  <div id="startScreen" class="screen active fade-in">
    <a class="btn-back-home" href="index.html">← Drills</a>
    <div class="logo-ring" id="logoRing">…</div>
    <h1 class="start-title" id="drillTitle">Loading…</h1>
    <p class="start-sub" id="drillDesc"></p>
    <button class="btn-primary" onclick="startQuiz()">Launch! 🚀</button>
  </div>

  <!-- === QUIZ === -->
  <div id="quizScreen" class="screen">
    <div class="quiz-top">
      <div class="round-badge" id="roundBadge">Round 1</div>
      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">0 / 0</div>
      </div>
      <button class="btn-icon" onclick="openStats()" title="Stats">📊</button>
    </div>

    <div class="score-row">
      <span>⚡ <span class="val" id="mistakeCount">0</span> mistakes</span>
      <span>⏱ <span class="val" id="timerDisplay">0:00</span></span>
    </div>

    <div class="question-card" id="questionCard">
      <div class="question-display" id="questionDisplay">? = ?</div>
      <div class="feedback-msg" id="feedbackMsg"></div>
      <input
        type="number"
        id="answerInput"
        class="answer-input"
        placeholder="?"
        autocomplete="off"
        inputmode="none"
        onkeydown="handleKey(event)"
      >
      <button class="btn-submit" onclick="submitAnswer()">Check ✓</button>

      <div class="numpad" id="numpad">
        <button class="numpad-key" data-key="7">7</button>
        <button class="numpad-key" data-key="8">8</button>
        <button class="numpad-key" data-key="9">9</button>
        <button class="numpad-key" data-key="4">4</button>
        <button class="numpad-key" data-key="5">5</button>
        <button class="numpad-key" data-key="6">6</button>
        <button class="numpad-key" data-key="1">1</button>
        <button class="numpad-key" data-key="2">2</button>
        <button class="numpad-key" data-key="3">3</button>
        <button class="numpad-key numpad-wide" data-key="0">0</button>
        <button class="numpad-key numpad-back" data-key="back">⌫</button>
      </div>
    </div>
  </div>


  <!-- === COMPLETE === -->
  <div id="completeScreen" class="screen">
    <div class="trophy-wrap" id="trophyWrap">🏆</div>
    <h1 class="complete-title" id="completeTitle">All Done!</h1>
    <p class="complete-sub" id="completeSub"></p>
    <div class="time-big" id="timeBig">0:00</div>
    <div class="time-label">total time</div>
    <div class="chips" id="chipsRow"></div>
    <div class="complete-actions">
      <button class="btn-primary" onclick="startQuiz()">Try Again 🔄</button>
      <button class="btn-secondary" onclick="openStats()">View Stats 📊</button>
      <a class="btn-back-home" href="index.html" style="margin-top:12px">← Pick Drill</a>
    </div>
  </div>

  <!-- === STATS === -->
  <div id="statsScreen" class="screen">
    <div class="stats-header">
      <button class="btn-back" onclick="closeStats()">← Back</button>
      <span class="stats-title" id="statsTitle">Stats</span>
    </div>
    <div id="statsContent" style="width:100%"></div>
  </div>

</div>

<script type="module">
/* ========================================
   LOAD DRILL FROM URL PARAM
   e.g. drill.html?drill=multiplication
   imports ./drills/multiplication.js
======================================== */
const params  = new URLSearchParams(location.search);
const drillId = params.get('drill');

if (!drillId) { location.href = 'index.html'; throw 0; }

let drill;
try {
  const mod = await import(`./drills/${drillId}.js`);
  drill = mod.default;
} catch (e) {
  console.error('Failed to load drill:', drillId, e);
  location.href = 'index.html';
  throw 0;
}

/* -- APPLY DRILL THEME -- */
document.title = `${drill.name} · Math Drills`;

// Set CSS accent color + rgb components for rgba() usage
document.documentElement.style.setProperty('--accent', drill.color);
const hex = drill.color.replace('#', '');
const r = parseInt(hex.slice(0, 2), 16);
const g = parseInt(hex.slice(2, 4), 16);
const b = parseInt(hex.slice(4, 6), 16);
document.documentElement.style.setProperty('--accent-rgb', `${r},${g},${b}`);

document.getElementById('logoRing').textContent  = drill.icon;
document.getElementById('drillTitle').textContent = drill.name;
document.getElementById('drillDesc').innerHTML   = drill.descDrill || '';
document.getElementById('statsTitle').textContent = `${drill.name} Stats`;

/* ========================================
   STATE
======================================== */
let currentQueue   = [];
let wrongQueue     = [];
let statsMap       = {}; // key → { q, firstTime, totalTime, attempts, gotRight }
let sessionStart   = 0;
let completionTime = 0;
let questionStart  = 0;
let totalMistakes  = 0;
let roundNum       = 1;
let qIdx           = 0;
let timerInterval  = null;
let confettiId     = null;
let transitioning  = false;
let prevScreen     = 'startScreen';

/* ========================================
   HELPERS
======================================== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(ms) {
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return m > 0 ? `${m}:${String(s).padStart(2, '0')}` : `${s}s`;
}

function formatSec(ms) { return (ms / 1000).toFixed(1) + 's'; }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active', 'fade-in'));
  const el = document.getElementById(id);
  el.classList.add('active');
  void el.offsetWidth;
  el.classList.add('fade-in');
  el.scrollTop = 0;
}

/* ========================================
   START / TIMER
======================================== */
function startQuiz() {
  stopConfetti();
  currentQueue   = shuffle(drill.questions());
  wrongQueue     = [];
  statsMap       = {};
  totalMistakes  = 0;
  roundNum       = 1;
  qIdx           = 0;
  transitioning  = false;
  completionTime = 0;
  sessionStart   = Date.now();
  startTimer();
  showScreen('quizScreen');
  renderQuestion();
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const el = document.getElementById('timerDisplay');
    if (!el) return;
    const elapsed = Date.now() - sessionStart;
    const m = Math.floor(elapsed / 60000);
    const s = Math.floor((elapsed % 60000) / 1000);
    el.textContent = `${m}:${String(s).padStart(2, '0')}`;
  }, 500);
}

/* ========================================
   QUIZ LOGIC
   q shape: { prompt, answer, key, ...any drill-specific fields }
======================================== */
function renderQuestion() {
  if (transitioning) return;
  if (qIdx >= currentQueue.length) { endRound(); return; }

  const q = currentQueue[qIdx];
  questionStart = Date.now();

  const pct = currentQueue.length > 0 ? (qIdx / currentQueue.length) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${qIdx} / ${currentQueue.length}`;
  document.getElementById('questionDisplay').textContent = `${q.prompt} = ?`;
  document.getElementById('mistakeCount').textContent = totalMistakes;
  document.getElementById('mistakeCount').style.color = totalMistakes > 0 ? 'var(--red)' : 'var(--text)';
  document.getElementById('roundBadge').textContent =
    roundNum === 1 ? 'Round 1' : `Corrections (×${roundNum - 1})`;

  const input = document.getElementById('answerInput');
  input.value = '';
  input.className = 'answer-input';

  const fb = document.getElementById('feedbackMsg');
  fb.textContent = '';
  fb.className = 'feedback-msg';

  setTimeout(() => input.focus(), 30);
}

function handleKey(e) {
  if (e.key === 'Enter') submitAnswer();
}

function submitAnswer() {
  if (transitioning) return;

  const input = document.getElementById('answerInput');
  const raw = input.value.trim();
  if (raw === '') return;
  const val = parseInt(raw, 10);
  if (isNaN(val)) return;

  const q = currentQueue[qIdx];
  const timeTaken = Date.now() - questionStart;

  if (!statsMap[q.key]) {
    statsMap[q.key] = { q, firstTime: timeTaken, totalTime: timeTaken, attempts: 1, gotRight: false };
  } else {
    statsMap[q.key].totalTime += timeTaken;
    statsMap[q.key].attempts++;
  }

  if (val === q.answer) {
    statsMap[q.key].gotRight = true;
    input.className = 'answer-input input-correct';
    flashFeedback(true);
    bounceCard();
    qIdx++;
    transitioning = true;
    setTimeout(() => { transitioning = false; renderQuestion(); }, 480);
  } else {
    totalMistakes++;
    wrongQueue.push(q);
    input.className = 'answer-input input-wrong';
    flashFeedback(false, q.answer);
    shakeCard();
    qIdx++;
    transitioning = true;
    setTimeout(() => { transitioning = false; renderQuestion(); }, 900);
  }
}

function flashFeedback(correct, correctAns) {
  const fb = document.getElementById('feedbackMsg');
  if (correct) {
    const msgs = ['✓ Correct!', '✓ Nice!', '✓ Yes!', '✓ 🔥', '✓ Nailed it!'];
    fb.textContent = msgs[Math.floor(Math.random() * msgs.length)];
    fb.className = 'feedback-msg correct';
  } else {
    fb.textContent = `✗  Answer: ${correctAns}`;
    fb.className = 'feedback-msg wrong';
  }
}

function bounceCard() {
  const c = document.getElementById('questionCard');
  c.classList.remove('card-bounce', 'card-shake');
  void c.offsetWidth;
  c.classList.add('card-bounce');
  setTimeout(() => c.classList.remove('card-bounce'), 400);
}

function shakeCard() {
  const c = document.getElementById('questionCard');
  c.classList.remove('card-bounce', 'card-shake');
  void c.offsetWidth;
  c.classList.add('card-shake');
  setTimeout(() => c.classList.remove('card-shake'), 500);
}

/* ========================================
   ROUND TRANSITIONS
======================================== */
function endRound() {
  if (wrongQueue.length === 0) {
    finishQuiz();
  } else {
    roundNum++;
    showRoundOverlay();
  }
}

function showRoundOverlay() {
  const count = wrongQueue.length;
  document.getElementById('overlayRound').textContent = `Correction Round ${roundNum - 1}`;
  document.getElementById('overlayCount').textContent =
    `${count} question${count !== 1 ? 's' : ''} to retry`;

  const bar = document.querySelector('.overlay-bar-fill');
  bar.style.animation = 'none';
  void bar.offsetWidth;
  bar.style.animation = 'shrink 2s linear forwards';

  document.getElementById('roundOverlay').classList.add('show');

  setTimeout(() => {
    document.getElementById('roundOverlay').classList.remove('show');
    currentQueue = shuffle(wrongQueue.slice());
    wrongQueue   = [];
    qIdx         = 0;
    transitioning = false;
    renderQuestion();
  }, 2100);
}

/* ========================================
   COMPLETION
======================================== */
function finishQuiz() {
  clearInterval(timerInterval); timerInterval = null;
  completionTime = Date.now() - sessionStart;

  showScreen('completeScreen');

  const perfect = totalMistakes === 0;
  document.getElementById('trophyWrap').textContent    = perfect ? '🌟' : '🏆';
  document.getElementById('completeTitle').textContent = perfect ? 'PERFECT RUN!' : 'All Done!';
  document.getElementById('completeSub').textContent   = perfect
    ? 'Zero mistakes - you\'re a math legend!'
    : `${totalMistakes} mistake${totalMistakes !== 1 ? 's' : ''} corrected. Well done!`;
  document.getElementById('timeBig').textContent = formatTime(completionTime);

  const allStats  = Object.values(statsMap);
  const avgMs     = allStats.reduce((s, x) => s + x.firstTime, 0) / allStats.length;
  const total     = currentQueue.length; // last round count; use drill label if available

  document.getElementById('chipsRow').innerHTML = `
    <div class="chip chip-accent">${drill.countLabel || allStats.length + ' facts'} ✓</div>
    <div class="chip ${perfect ? 'chip-green' : 'chip-red'}">${perfect ? '0 mistakes 🔥' : totalMistakes + ' mistakes'}</div>
    <div class="chip chip-green">avg ${formatSec(avgMs)} / q</div>
  `;

  startConfetti();
}

/* ========================================
   STATS
   Supports two modes:
   - Grouped: if drill exports statsGroup(q) → string
   - Flat:    sorted slowest first
======================================== */
function openStats() {
  const active = document.querySelector('.screen.active');
  prevScreen = active ? active.id : 'quizScreen';
  buildStats();
  showScreen('statsScreen');
}

function closeStats() {
  showScreen(prevScreen);
  if (prevScreen === 'quizScreen') {
    setTimeout(() => {
      const inp = document.getElementById('answerInput');
      if (inp) inp.focus();
    }, 80);
  }
}

function buildStats() {
  const allStats  = Object.values(statsMap);
  const container = document.getElementById('statsContent');

  if (allStats.length === 0) {
    container.innerHTML = '<p class="no-data">No data yet - answer some questions first!</p>';
    return;
  }

  const elapsed    = completionTime > 0 ? completionTime : (Date.now() - sessionStart);
  const avgFirstMs = allStats.reduce((s, x) => s + x.firstTime, 0) / allStats.length;
  const answered   = allStats.length;

  let html = `
    <div class="overview-grid">
      <div class="ov-card"><div class="ov-val">${formatTime(elapsed)}</div><div class="ov-lbl">total time</div></div>
      <div class="ov-card"><div class="ov-val">${formatSec(avgFirstMs)}</div><div class="ov-lbl">avg / question</div></div>
      <div class="ov-card"><div class="ov-val">${answered}</div><div class="ov-lbl">answered</div></div>
    </div>`;

  if (drill.statsGroup) {
    /* -- GROUPED VIEW -- */
    const groupMap = {};
    for (const stat of allStats) {
      const key = drill.statsGroup(stat.q);
      if (!groupMap[key]) groupMap[key] = [];
      groupMap[key].push(stat);
    }

    const groups = Object.entries(groupMap).map(([key, stats]) => ({
      key,
      avg:   stats.reduce((s, x) => s + x.firstTime, 0) / stats.length,
      stats,
    })).sort((a, b) => b.avg - a.avg); // slowest first

    const maxAvg = Math.max(...groups.map(g => g.avg));
    const minAvg = Math.min(...groups.map(g => g.avg));

    html += '<div class="section-title">Average time by group</div>';
    for (const g of groups) {
      const pct      = maxAvg > 0 ? (g.avg / maxAvg) * 100 : 0;
      const isSlow   = g.avg === maxAvg && groups.length > 1;
      const isFast   = g.avg === minAvg && groups.length > 1;
      html += `
        <div class="table-avg-row">
          <span class="tbl-label">${g.key}</span>
          <div class="tbl-bar-track"><div class="tbl-bar-fill" style="width:${pct}%"></div></div>
          <span class="tbl-time">${formatSec(g.avg)}</span>
          <span class="tbl-badge-wrap">
            ${isSlow ? '<span class="tbl-badge badge-slow">slowest</span>' :
              isFast ? '<span class="tbl-badge badge-fast">fastest</span>' : ''}
          </span>
        </div>`;
    }

    html += '<div class="divider"></div><div class="section-title">Question breakdown</div>';

    for (const g of groups) {
      html += `<div class="table-section">
        <div class="table-section-hdr">${g.key} - avg ${formatSec(g.avg)}</div>`;
      for (const s of [...g.stats].sort((a, b) => b.firstTime - a.firstTime)) {
        const hadMistake = !s.gotRight || s.attempts > 1;
        html += `<div class="q-row">
          <span class="q-eq">${s.q.prompt} = ${s.q.answer}</span>
          <span class="q-time">${formatSec(s.firstTime)}</span>
          <span class="q-badge ${hadMistake ? 'badge-err' : 'badge-ok'}">${s.attempts > 1 ? s.attempts + ' tries' : '✓ first'}</span>
        </div>`;
      }
      html += '</div>';
    }

  } else {
    /* -- FLAT VIEW -- */
    html += '<div class="section-title">Questions - slowest first</div>';
    const sorted = [...allStats].sort((a, b) => b.firstTime - a.firstTime);
    for (const s of sorted) {
      const hadMistake = !s.gotRight || s.attempts > 1;
      html += `<div class="q-row">
        <span class="q-eq">${s.q.prompt} = ${s.q.answer}</span>
        <span class="q-time">${formatSec(s.firstTime)}</span>
        <span class="q-badge ${hadMistake ? 'badge-err' : 'badge-ok'}">${s.attempts > 1 ? s.attempts + ' tries' : '✓ first'}</span>
      </div>`;
    }
  }

  container.innerHTML = html;
}

/* ========================================
   CONFETTI
======================================== */
function startConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  const colors = ['#00e5c4','#ff2d78','#ffd60a','#8b5cf6','#4cc9f0','#ff9f43','#00c875'];
  const pieces = Array.from({ length: 180 }, () => ({
    x: Math.random() * canvas.width, y: -20 - Math.random() * 300,
    w: 6 + Math.random() * 10, h: 3 + Math.random() * 6,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - 0.5) * 4, vy: 1.8 + Math.random() * 3.5,
    angle: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 0.18,
  }));

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of pieces) {
      p.x += p.vx; p.y += p.vy; p.angle += p.spin;
      if (p.y < canvas.height + 40) alive = true;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if (alive) confettiId = requestAnimationFrame(draw);
    else canvas.style.display = 'none';
  }
  stopConfetti(); draw();
}

function stopConfetti() {
  if (confettiId) { cancelAnimationFrame(confettiId); confettiId = null; }
  const canvas = document.getElementById('confettiCanvas');
  canvas.style.display = 'none';
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

/* ========================================
   ON-SCREEN NUMPAD (mouse-only input)
======================================== */
document.getElementById('numpad').addEventListener('click', (e) => {
  const btn = e.target.closest('.numpad-key');
  if (!btn) return;
  const input = document.getElementById('answerInput');
  const key = btn.dataset.key;

  if (key === 'back') {
    input.value = input.value.slice(0, -1);
  } else {
    input.value += key;
  }
  input.focus();
});

/* -- EXPOSE TO INLINE ONCLICK HANDLERS -- */
window.startQuiz    = startQuiz;
window.submitAnswer = submitAnswer;
window.handleKey    = handleKey;
window.openStats    = openStats;
window.closeStats   = closeStats;
</script>
</body>
</html>
